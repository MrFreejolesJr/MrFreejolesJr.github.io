<!DOCTYPE html>
<html>
    <head>
        <title>Ramses Nuñez</title>
        <script>
            function calcularDatos(){
                let inputElement1 = document.getElementById('promedio-input');
                let promedio = parseInt(inputElement1.value);

                let inputElement2 = document.getElementById('costo-input');
                let costo = parseInt(inputElement2.value);

                let inputElement3 = document.getElementById('meses-input');
                let meses = parseInt(inputElement3.value);

                let beca = 0;
                let subtotal = 0;
                let total = 0;
				let mensualidad = 0;
                if (promedio > 95) {
                    beca = 100;
                    subtotal = 0;
                }
                else if (promedio > 90) {
                    beca = 80;
                    subtotal = costo * .20;
                }
                else if (promedio >85) {
                    beca = 60;
                    subtotal = costo * .40;
                }
                else {
                    subtotal = costo;
                }
				mensualidad = total / meses;
                if (isNaN(promedio)||isNaN(costo)||isNaN(meses)){
                  alert('Valor invalido, favor de introducir un numero valido');
                    
}
                else if ((promedio>100)||(promedio<0)){
                    alert('Favor de introducir una calificacion valida (0-100)');
                }
                total = subtotal + ((subtotal * 0.10) * meses);
                let outputElement = document.getElementById('output');
                outputElement.innerText = 'Su promedio de ' + promedio + ' de calificacion le financia un ' + beca + '% de su colegiatura, dando un subtotal de: ' + subtotal + 
                    '$ y un total de ' + total + '$ a ' + meses + ' pagos de ' + mensualidad + '$ con 10% de interes agregado';
            }
        </script>
    </head>
    <body>
        <h1>Calculadora de becas y financiamiento estudiantil</h1>
      <style>
        body {
          background-color: linen;
        }
        h1 {
          text-align: center;
          font-size: 32px;
				background-color: lightblue;
        }
        table {
          text-align: center;
          background-color: gold;
        }
        td {
          align="center";
          background-color: lightblue;
        }
        #output {
          font-size: 24px;
        }
      </style>
      <table style="margin: 0px auto;" border="1" cellpadding=10>
  <tbody>
    <tr>
      <td  width=100>
        <input id = 'promedio-input'>
            Promedio
            </input>
        <input id = 'costo-input'>
            Costo
            </input>
        <input id = 'meses-input'>
            Meses
            </input>
<p></p>
        <button onclick = "calcularDatos();">
            Aceptar
        </button>
        </tbody>
</table>
<table style="margin: 0px auto;" border="1" cellpadding=10>
  <tbody>
    <tr>
      <td width=300>
        <p id="output"></p>
    </body>
</html>
