<!DOCTYPE html>
<html>
    <head>
        <title>Quiubole</title>
        <script>
            function diHola (){
                let inputElement = document.getElementById('name-input');
                let name = inputElement.value;

                let outputElement = document.getElementById('output');
                outputElement.innerText = 'hola ' + name + '!'
            }
        </script>
    </head>
    <body>
        <button onclick = "diHola();">
            cola

        </button>
        <input id = 'name-input' />
        
        <p id="output"></p>
    </body>
</html>
